<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMersWallet - Asisten Keuangan Pribadi & Bisnis</title>
    <!-- Tailwind CSS untuk Desain Responsif & Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ApexCharts untuk Visualisasi Data Finansial -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <!-- Lucide Icons untuk Ikon Premium Modern -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font Plus Jakarta Sans Premium dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dana-blue: #18b8c8;
            --dana-dark: #0b7f93;
            --dana-light: #edf4fb;
            --paper: #eef4fb;
            --paper-2: #f6f9fd;
            --ink: #102033;
            --muted: #728198;
            --teal: #15c8b8;
            --cyan: #3ed6f2;
            --violet: #7a67ff;
            --gold: #f3b431;
            --emerald: #10B981;
            --rose: #F43F5E;
            --radius-xl: 32px;
            --neu-light: rgba(255, 255, 255, .92);
            --neu-dark: rgba(125, 149, 174, .32);
            --neu-shadow: 18px 18px 42px rgba(132, 154, 181, .30), -18px -18px 42px rgba(255,255,255,.94);
            --neu-soft: 10px 10px 24px rgba(132,154,181,.22), -10px -10px 24px rgba(255,255,255,.9);
            --neu-inset: inset 8px 8px 18px rgba(132,154,181,.22), inset -8px -8px 18px rgba(255,255,255,.92);
        }

        * { -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at 8% 0%, rgba(255,255,255,.98) 0, rgba(255,255,255,.0) 34%),
                radial-gradient(circle at 90% 12%, rgba(87,112,255,.12) 0, rgba(87,112,255,0) 28%),
                radial-gradient(circle at 70% 78%, rgba(21,200,184,.13) 0, rgba(21,200,184,0) 34%),
                linear-gradient(145deg, #f7fbff 0%, #edf4fb 45%, #e8f0f8 100%);
            color: var(--ink);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background:
                linear-gradient(135deg, rgba(255,255,255,.48), rgba(255,255,255,0) 36%),
                repeating-linear-gradient(135deg, rgba(31,53,83,.025) 0 1px, transparent 1px 14px);
            opacity: .75;
        }

        .bg-dana { background: linear-gradient(145deg, #35d5cf, #12aabf) !important; }
        .bg-dana-dark { background: linear-gradient(145deg, #1294a9, #07778c) !important; }
        .text-dana { color: var(--dana-blue) !important; }
        .border-dana { border-color: var(--dana-blue) !important; }
        .focus\:border-dana:focus { border-color: rgba(24,184,200,.75) !important; box-shadow: var(--neu-inset), 0 0 0 3px rgba(24,184,200,.10) !important; }

        .card-shadow {
            border: 1px solid rgba(255,255,255,.78) !important;
            background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(232,240,248,.72)) !important;
            box-shadow: var(--neu-shadow) !important;
        }
        .bottom-nav {
            box-shadow: 0 -18px 36px rgba(132,154,181,.20), inset 0 1px 0 rgba(255,255,255,.88) !important;
            background: rgba(240,246,252,.88) !important;
            backdrop-filter: blur(18px);
        }

        aside {
            background: linear-gradient(165deg, rgba(247,251,255,.95), rgba(230,239,248,.92)) !important;
            border-right: 1px solid rgba(255,255,255,.72) !important;
            box-shadow: 18px 0 42px rgba(132,154,181,.16), inset -1px 0 0 rgba(255,255,255,.65);
        }
        aside nav button,
        #navbar button,
        button,
        a {
            transition: transform .22s ease, box-shadow .22s ease, background .22s ease, color .22s ease, border-color .22s ease;
        }
        aside nav button:hover,
        button:hover,
        a:hover { transform: translateY(-1px); }
        aside nav button.text-dana,
        aside nav button[id^="side-"][class*="text-dana"] {
            background: linear-gradient(145deg, #f8fbff, #e6f0f8) !important;
            box-shadow: var(--neu-soft) !important;
            color: var(--dana-blue) !important;
            border: 1px solid rgba(255,255,255,.82);
        }
        aside nav button:not(.text-dana):hover {
            background: rgba(255,255,255,.48) !important;
            box-shadow: 8px 8px 18px rgba(132,154,181,.16), -8px -8px 18px rgba(255,255,255,.75);
        }

        input, select, textarea {
            background: linear-gradient(145deg, #eef4fb, #f8fbff) !important;
            border: 1px solid rgba(255,255,255,.78) !important;
            box-shadow: var(--neu-inset) !important;
            color: var(--ink) !important;
        }
        input::placeholder, textarea::placeholder { color: #97a5b7 !important; }

        /* Deep neumorphism blocks */
        .bg-white,
        .bg-slate-50,
        .bg-blue-50,
        .bg-blue-50\/50,
        .bg-blue-50\/70,
        .bg-slate-50\/50,
        .bg-emerald-50,
        .bg-emerald-50\/60,
        .bg-rose-50,
        .bg-rose-50\/60,
        .bg-purple-50,
        .bg-amber-50,
        .bg-cyan-50 {
            background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(230,239,248,.72)) !important;
        }
        .border-slate-100, .border-blue-100, .border-emerald-100, .border-rose-100, .border-slate-200 {
            border-color: rgba(255,255,255,.72) !important;
        }
        .shadow-xs, .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl {
            box-shadow: var(--neu-soft) !important;
        }

        /* Main dashboard hero: soft glossy teal card */
        .bg-dana.rounded-\[36px\] {
            background:
                radial-gradient(circle at 12% 10%, rgba(255,255,255,.32), transparent 34%),
                radial-gradient(circle at 86% 12%, rgba(126,105,255,.34), transparent 30%),
                linear-gradient(145deg, #1bd4c4 0%, #11a8c5 42%, #116f98 100%) !important;
            box-shadow: 20px 22px 48px rgba(93,131,160,.36), -18px -18px 40px rgba(255,255,255,.92), inset 1px 1px 0 rgba(255,255,255,.55), inset -8px -10px 24px rgba(0,58,85,.24) !important;
            border: 1px solid rgba(255,255,255,.72) !important;
        }
        .bg-dana.rounded-\[36px\]::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 35px;
            background: linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,0) 42%);
            pointer-events: none;
        }
        .bg-dana.rounded-\[36px\] .bg-white\/10 {
            background: rgba(255,255,255,.18) !important;
            box-shadow: inset 4px 4px 12px rgba(0,74,96,.16), inset -4px -4px 12px rgba(255,255,255,.24) !important;
            border: 1px solid rgba(255,255,255,.28) !important;
        }

        .rounded-\[40px\], .rounded-\[36px\], .rounded-\[32px\], .rounded-3xl, .rounded-\[28px\] {
            box-shadow: var(--neu-shadow);
        }

        table thead tr { background: linear-gradient(145deg, #f8fbff, #e9f1f9) !important; }
        table tbody tr:hover { background: rgba(255,255,255,.42) !important; }

        #pin-lockscreen {
            background:
                radial-gradient(circle at 50% 0%, rgba(27,212,196,.18), transparent 30%),
                radial-gradient(circle at 80% 75%, rgba(126,105,255,.15), transparent 34%),
                linear-gradient(145deg, rgba(239,246,252,.96), rgba(222,234,246,.96)) !important;
        }
        #pin-container-box {
            background: linear-gradient(145deg, rgba(255,255,255,.62), rgba(230,239,248,.62));
            box-shadow: 22px 22px 54px rgba(72,95,120,.28), -22px -22px 54px rgba(255,255,255,.88), inset 1px 1px 0 rgba(255,255,255,.75);
            border: 1px solid rgba(255,255,255,.78);
            border-radius: 42px;
            padding: 34px 26px;
            backdrop-filter: blur(18px);
        }
        #pin-container-box h2 { color: var(--ink); text-shadow: 0 2px 0 rgba(255,255,255,.6); }
        #pin-container-box p { color: var(--muted) !important; }
        #pin-container-box .grid button {
            background: linear-gradient(145deg, #f8fbff, #dfeaf5) !important;
            color: var(--ink) !important;
            border: 1px solid rgba(255,255,255,.74);
            box-shadow: 10px 10px 24px rgba(132,154,181,.28), -10px -10px 24px rgba(255,255,255,.92) !important;
        }
        #pin-container-box .grid button:active {
            box-shadow: var(--neu-inset) !important;
            transform: scale(.98);
        }
        #pin-dots div { border-color: rgba(114,129,152,.42) !important; box-shadow: var(--neu-inset); }
        #pin-dots div.bg-dana { box-shadow: 0 0 0 6px rgba(24,184,200,.10), var(--neu-soft) !important; }

        #toast {
            background: rgba(18,32,51,.92) !important;
            border: 1px solid rgba(255,255,255,.14);
            backdrop-filter: blur(18px);
            box-shadow: 18px 18px 42px rgba(67,83,105,.28) !important;
        }
        #modal-overlay { background: rgba(54,71,91,.28) !important; backdrop-filter: blur(16px); }
        #modal-box {
            background: linear-gradient(145deg, rgba(255,255,255,.86), rgba(231,240,249,.88)) !important;
            border: 1px solid rgba(255,255,255,.80);
            box-shadow: 28px 28px 72px rgba(70,94,122,.32), -18px -18px 48px rgba(255,255,255,.8) !important;
        }

        .logo-transparent-wrap { background: transparent !important; box-shadow: none !important; border: 0 !important; overflow: visible !important; }
        .logo-transparent-img { display:block; width:100%; height:100%; object-fit:contain; background:transparent!important; border:0!important; box-shadow:none!important; border-radius:0!important; }
        #lockscreen-logo-container, #lockscreen-logo-container img { background:transparent!important; box-shadow:none!important; border:0!important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-fade { animation: fadeIn .42s cubic-bezier(.16,1,.3,1) forwards; }
        @keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)} }
        .animate-shake { animation: shake .2s ease-in-out 2; }

        /* Fine tuning mobile */
        @media (max-width: 768px) {
            :root { --neu-shadow: 12px 12px 28px rgba(132,154,181,.25), -12px -12px 28px rgba(255,255,255,.88); }
            #navbar { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
            .rounded-\[40px\], .rounded-\[36px\] { border-radius: 28px !important; }
        }
    </style>
</head>
<body class="pb-24 lg:pb-0 min-h-screen flex flex-col lg:flex-row font-sans">

    <!-- SCREEN LOCK PIN 6-DIGIT (Gaya Aplikasi HP Finansial Aman) -->
    <div id="pin-lockscreen" class="fixed inset-0 bg-slate-900/95 z-[150] flex flex-col items-center justify-center p-6 backdrop-blur-md">
        <div class="w-full max-w-sm flex flex-col items-center space-y-8 animate-fade" id="pin-container-box">
            
            <!-- Input Rahasia Asli (Memicu keyboard fisik/bawaan HP) -->
            <input type="password" id="real-pin-input" class="absolute -top-40 opacity-0 w-1 h-1 pointer-events-none" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" oninput="handlePinInput(this.value)">

            <div class="text-center space-y-2">
                <!-- LOGO DINAMIS PADA LOCKSCREEN -->
                <div id="lockscreen-logo-container" class="cursor-pointer flex justify-center w-full" onclick="focusPinInput()">
                    <!-- Diisi otomatis oleh fungsi renderLogo() -->
                </div>
                <h2 class="text-3xl font-black mt-4"><span class="text-[#108EE9]">iMers</span><span class="text-[#00E5FF]">WALLET</span></h2>
                <p class="text-sm text-slate-300 font-medium">Masukkan PIN 6-Digit</p>
            </div>

            <!-- Titik Penunjuk PIN (Mengetuk area ini akan fokus ke input HP) -->
            <div class="flex gap-4 justify-center py-4 cursor-pointer" id="pin-dots" onclick="focusPinInput()">
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
            </div>

            <!-- Tombol Keypad Numerik Statis (Responsif & Anti-Freeze) -->
            <div class="grid grid-cols-3 gap-6 w-full max-w-[280px]">
                <button onclick="pressPinNumber(1)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">1</button>
                <button onclick="pressPinNumber(2)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">2</button>
                <button onclick="pressPinNumber(3)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">3</button>
                
                <button onclick="pressPinNumber(4)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">4</button>
                <button onclick="pressPinNumber(5)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">5</button>
                <button onclick="pressPinNumber(6)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">6</button>
                
                <button onclick="pressPinNumber(7)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">7</button>
                <button onclick="pressPinNumber(8)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">8</button>
                <button onclick="pressPinNumber(9)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">9</button>
                
                <button onclick="clearPin()" class="w-16 h-16 rounded-full text-slate-400 font-bold text-xs flex items-center justify-center hover:bg-slate-800/50 active:scale-95 transition-all outline-none font-sans">Hapus</button>
                <button onclick="pressPinNumber(0)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">0</button>
                <button onclick="backspacePin()" class="w-16 h-16 rounded-full text-rose-500 font-bold flex items-center justify-center hover:bg-rose-500/10 active:scale-95 transition-all outline-none">
                    <i data-lucide="delete" class="w-6 h-6 mx-auto"></i>
                </button>
            </div>

            <!-- Opsi Bantuan Jika Lupa PIN -->
            <div class="text-center pt-2">
                <button onclick="requestForgotPin()" class="text-xs text-dana hover:text-blue-300 font-bold tracking-wide transition-colors flex items-center gap-1.5 mx-auto">
                    <i data-lucide="key-round" class="w-3.5 h-3.5"></i> Lupa PIN? Kirim via WA & Email
                </button>
            </div>
        </div>
    </div>

    <!-- Sidebar Desktop (Hanya muncul di Desktop / Tablet Besar) -->
    <aside class="hidden lg:flex flex-col w-72 bg-white border-r border-slate-100 p-6 space-y-8 min-h-screen shrink-0">
        <!-- HEADER LOGO DINAMIS SIDEBAR -->
        <div class="flex items-center gap-3 px-2">
            <div id="sidebar-logo-container" class="flex justify-center shrink-0">
                <!-- Diisi otomatis oleh renderLogo() -->
            </div>
            <span class="text-xl font-extrabold tracking-tight text-slate-900">iMers<span class="text-dana">Wallet</span></span>
        </div>

        <!-- Menu Navigasi Utama -->
        <nav class="flex-1 space-y-1">
            <button onclick="router('home')" id="side-home" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-dana bg-blue-50/50 transition-all">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
                <span>Dashboard Utama</span>
            </button>
            <button onclick="router('history')" id="side-history" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="history" class="w-5 h-5"></i>
                <span>Riwayat Transaksi</span>
            </button>
            <button onclick="router('analytics')" id="side-analytics" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="pie-chart" class="w-5 h-5"></i>
                <span>Analisis Pengeluaran</span>
            </button>
            <button onclick="router('walletReport')" id="side-walletReport" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="file-text" class="w-5 h-5"></i>
                <span>Wallet Report</span>
            </button>
            <button onclick="router('walletChat')" id="side-walletChat" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="message-circle" class="w-5 h-5"></i>
                <span>Wallet Chat</span>
            </button>
            <button onclick="router('users')" id="side-users" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="users-round" class="w-5 h-5"></i>
                <span>Users & Access</span>
            </button>
            <button onclick="router('profile')" id="side-profile" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span>Bot WA & Pengaturan</span>
            </button>
            
            <!-- Tombol Keluar Sesi Desktop -->
            <button onclick="logout()" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-rose-500 hover:bg-rose-50 transition-all mt-4">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                <span>Keluar Sesi</span>
            </button>
        </nav>

        <!-- Box WhatsApp Info Pencatatan Cepat -->
        <div class="bg-blue-50/70 rounded-3xl p-5 space-y-3">
            <div class="flex items-center gap-2 text-dana">
                <i data-lucide="sparkles" class="w-5 h-5 animate-pulse"></i>
                <span class="text-xs font-bold uppercase tracking-wider">Catat Cepat</span>
            </div>
            <p class="text-xs text-slate-500 font-medium leading-relaxed font-semibold">Kirim chat WA ke bot asisten untuk mencatatkan pemasukan/pengeluaran secara instan.</p>
            <a id="desktop-wa-btn" href="#" target="_blank" class="w-full py-2.5 bg-dana hover:bg-dana-dark text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all shadow-md shadow-blue-100">
                <i data-lucide="message-square" class="w-4 h-4"></i> Chat Asisten WA
            </a>
        </div>

        <div class="pt-2 border-t border-slate-100">
            <p id="sidebar-footer-text" class="text-[10px] text-slate-400 font-bold leading-relaxed px-2">
                Developed by Terry Katar | iMersnesia.com
            </p>
        </div>
    </aside>

    <!-- Area Utama Tempat Menampilkan Halaman Dinamis -->
    <main class="flex-1 min-w-0">
        <div id="app" class="w-full">
            <!-- Skrin Loader Saat Menghubungkan Apps Script -->
            <div id="global-loader" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
                <div class="flex flex-col items-center gap-4">
                    <div class="w-12 h-12 border-4 border-blue-100 border-t-dana rounded-full animate-spin"></div>
                    <p class="text-sm font-bold text-gray-500">Menghubungkan Pangkalan Data iMersWallet...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Navigasi Bawah Khusus HP (Mobile Bottom Navigation) -->
    <nav id="navbar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center py-4 z-50 lg:hidden bottom-nav rounded-t-[32px]">
        <button onclick="router('home')" id="nav-home" class="flex flex-col items-center gap-1 text-dana transition-all">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Utama</span>
        </button>
        <button onclick="router('history')" id="nav-history" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="history" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Riwayat</span>
        </button>
        
        <!-- FAB Floating Button Tambah Transaksi -->
        <div class="relative -top-8">
            <button onclick="openModal('addTransaction')" class="w-14 h-14 bg-dana hover:bg-dana-dark text-white rounded-full shadow-lg shadow-blue-200 border-4 border-white flex items-center justify-center hover:scale-105 transition-all">
                <i data-lucide="plus" class="w-7 h-7"></i>
            </button>
        </div>
        
        <button onclick="router('analytics')" id="nav-analytics" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="pie-chart" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Analisis</span>
        </button>
        <button onclick="router('walletReport')" id="nav-walletReport" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="file-text" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Report</span>
        </button>
        <button onclick="router('walletChat')" id="nav-walletChat" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="message-circle" class="w-6 h-6"></i>

        // --- FETCH DENGAN TIMEOUT HELPER ---
        // MENINGKATKAN TIMEOUT KE 15 DETIK AGAR COLD START SPREADSHEET GOOGLE TIDAK MEMBUAT SINKRONISASI MATI
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 15000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, {
                    ...options,
                    signal: controller.signal  
                });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

            const walletLabel = wallet === 'all' ? 'Semua Dompet Aktif' : getWalletLabel(wallet);
            const monthName = document.querySelector(`#report-month option[value="${month}"]`)?.textContent || '';
            const filtered = (state.data.transactions || []).filter(t => {
                const d = new Date(t.date);
                if (isNaN(d.getTime())) return false;
                const matchMonth = d.getMonth() + 1 === Number(month);
                const matchYear = d.getFullYear() === Number(year);
                const matchWallet = wallet === 'all' || String(t.wallet || getDefaultWalletName()) === String(wallet);
                return matchMonth && matchYear && matchWallet;
            });
            const incomeByCategory = {};
            const expenseByCategory = {};
            let income = 0, expense = 0;
            filtered.forEach(t => {
                const amount = Number(t.amount || 0);
                const cat = t.category || 'Lainnya';
                if (t.type === 'income') {
                    income += amount;
                    incomeByCategory[cat] = (incomeByCategory[cat] || 0) + amount;
                } else {
                    expense += amount;
                    expenseByCategory[cat] = (expenseByCategory[cat] || 0) + amount;
                }
            });
            const toRows = obj => Object.keys(obj).map(category => ({ category, total: obj[category] })).sort((a, b) => b.total - a.total);
            const incomeRows = toRows(incomeByCategory);
            const expenseRows = toRows(expenseByCategory);
            const topIncome = incomeRows[0] || null;
            const topExpense = expenseRows[0] || null;
            const balance = income - expense;
            const notes = [
                topIncome ? `High income terbesar berasal dari kategori ${topIncome.category} sebesar ${formatIDR(topIncome.total)}.` : 'Belum ada pemasukan pada periode ini.',
                topExpense ? `High expenses terbesar berasal dari kategori ${topExpense.category} sebesar ${formatIDR(topExpense.total)}.` : 'Belum ada pengeluaran pada periode ini.',
                balance > 0 ? `Cashflow ${walletLabel} positif sebesar ${formatIDR(balance)}.` : balance < 0 ? `Cashflow ${walletLabel} minus sebesar ${formatIDR(balance)}.` : `Cashflow ${walletLabel} netral pada periode ini.`
            ];
            return {
                wallet, walletLabel, month: Number(month), year: Number(year), periodLabel: `${monthName} ${year}`,
                generatedAt: new Date().toLocaleString('id-ID'),
                summary: { income, expense, balance, transactionCount: filtered.length },
                incomeByCategory: incomeRows,
                expenseByCategory: expenseRows,
                topIncome,
                topExpense,
                notes,
                transactions: filtered.map(t => ({ ...t, walletLabel: getWalletLabel(t.wallet) }))
            };
        }

        function pushWalletChatMessage(from, text) {
            if (!Array.isArray(state.walletChatMessages)) state.walletChatMessages = [];
            state.walletChatMessages.push({ from, text, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) });
            if (state.walletChatMessages.length > 80) state.walletChatMessages = state.walletChatMessages.slice(-80);
        }

        function quickWalletChat(text) {
            const input = document.getElementById('wallet-chat-input');
            if (input) input.value = text;
            sendWalletChatMessage();
        }

        function localWalletChatParser(text) {
            const msg = String(text || '').toLowerCase();
            if (msg === 'saldo' || msg.includes('cek saldo')) {
                return { type: 'command', reply: `Total saldo aktif: ${formatIDR(state.data.stats.balance || 0)}` };
            }
            const amountMatch = msg.match(/(\d+)\s*(rb|ribu|jt|juta|k)?/i);
            if (!amountMatch) return { type: 'unknown', reply: 'Format belum dikenali. Contoh: makan 25rb pribadi, gaji 5jt bisnis, atau saldo.' };
            let amount = parseInt(amountMatch[1], 10);
            const unit = (amountMatch[2] || '').toLowerCase();
            if (['rb', 'ribu', 'k'].includes(unit)) amount *= 1000;
            if (['jt', 'juta'].includes(unit)) amount *= 1000000;
            let type = /(masuk|gaji|terima|bonus|pemasukan|income|dapat|freelance|nabung)/.test(msg) ? 'income' : 'expense';
            let wallet = getDefaultWalletName();
            getActiveWallets().forEach(w => {
                const keys = [w.wallet, w.label].concat(Array.isArray(w.keywords) ? w.keywords : String(w.keywords || '').split(','));
                if (keys.some(k => k && msg.includes(String(k).toLowerCase()))) wallet = w.wallet;
            });
            let category = 'Lainnya';
            if (/(makan|minum|kopi|bakso|nasi|ayam|mie)/.test(msg)) category = 'Makanan';
            if (/(bensin|grab|gojek|parkir|transport|tol|ojek)/.test(msg)) category = 'Transportasi';
            if (/(listrik|wifi|token|air|pulsa|kuota|internet)/.test(msg)) category = 'Tagihan';
            if (/(gaji|fee|bonus|freelance)/.test(msg)) category = 'Gaji';
            if (/(belanja|shopee|tokopedia|mall)/.test(msg)) category = 'Belanja';
            const note = msg.replace(amountMatch[0], '').replace(/(expense|income|masuk|keluar|beli|bayar|dapat|uang)/g, '').trim() || category;
            return { type: 'transaction', transaction: { date: new Date().toISOString().slice(0, 10), type, category, amount, note, wallet }, reply: `✅ Dicatat lokal.\nKantong: ${getWalletLabel(wallet)}\nTipe: ${type === 'income' ? 'Pemasukan' : 'Pengeluaran'}\nKategori: ${category}\nNominal: ${formatIDR(amount)}` };
        }

        async function sendWalletChatMessage() {
            const input = document.getElementById('wallet-chat-input');
            const message = input?.value.trim() || '';
            if (!message) return;
            if (input) input.value = '';
            pushWalletChatMessage('user', message);
            render();
            try {
                const params = new URLSearchParams({ action: 'walletChat', message });
                const response = await fetchWithTimeout(`${CONFIG.API_URL}?${params.toString()}`, { timeout: 18000 });
                const data = await response.json();
                if (!data || data.status !== 'success') throw new Error(data?.message || 'Gagal proses chat');
                pushWalletChatMessage('bot', data.result.reply || 'Berhasil diproses.');
                if (data.result.transaction) await fetchDashboardData();
                else render();
            } catch (err) {
                const local = localWalletChatParser(message);
                if (local.transaction) {
                    state.data.transactions.push(local.transaction);

        function filterHistory() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const typeVal = document.getElementById('type-filter').value;
            const rows = document.querySelectorAll('#history-table-body tr');
            
            rows.forEach(row => {
                const type = row.getAttribute('data-type');
                const note = row.getAttribute('data-note');
                const matchSearch = note.includes(searchVal);
                const matchType = (typeVal === 'all' || type === typeVal);
                if (matchSearch && matchType) {
                    row.classList.remove('hidden');
                } else {
                    row.classList.add('hidden');
                }
            });
        }

        // --- SIMPAN KONFIGURASI DAN TEMPLAT KEMBALI KE SPREADSHEET ---
        // MENAMBAH VALIDASI CEK KEUTUHAN JALUR URL GAS AGAR TIDAK SALAH COPAST SECARA TRUNCATED
        async function saveAllSettings() {
            const apiVal = document.getElementById('cfg-api-url')?.value.trim() || CONFIG.API_URL;
            const tokenVal = document.getElementById('cfg-fonnte-token')?.value.trim() || '';
            const botVal = document.getElementById('cfg-bot-number')?.value.trim() || '';
            const logoVal = document.getElementById('cfg-app-logo')?.value.trim() || '';
            const footerVal = document.getElementById('cfg-footer-text')?.value.trim() || 'Developed by Terry Katar | iMersnesia.com';
            const emailVal = document.getElementById('cfg-user-email')?.value.trim() || '';
            const pinVal = document.getElementById('cfg-user-pin')?.value.trim() || '';
            const enableBudgetVal = document.getElementById('cfg-enable-budget')?.value || 'TRUE';

            const tmplSuccess = document.getElementById('tmpl-success')?.value || '';
            const tmplOverBudget = document.getElementById('tmpl-over-budget')?.value || '';
            const tmplWarnBudget = document.getElementById('tmpl-warn-budget')?.value || '';
            const tmplWeekly = document.getElementById('tmpl-weekly')?.value || '';

            if (apiVal) {
                if (!apiVal.startsWith("https://script.google.com/") || !apiVal.includes("/exec")) {
                    return showToast("URL Apps Script tidak valid! Pastikan diakhiri dengan /exec", "warn");
                }
                CONFIG.API_URL = apiVal;
            }

            const queryParams = new URLSearchParams({
                action: 'saveSettings',
                fonnte_token: tokenVal,
                bot_number: botVal,
                app_logo: logoVal,
                footer_text: footerVal,
                app_footer_text: footerVal,
                user_email: emailVal,
                user_pin: pinVal,
                enable_budget: enableBudgetVal,
                template_success: tmplSuccess,
                template_over_budget: tmplOverBudget,
                template_warn_budget: tmplWarnBudget,
                template_weekly_report: tmplWeekly
            });

            showToast("Menyimpan Pengaturan Ke Google Sheet...", "success");

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_URL}?${queryParams.toString()}`, { timeout: 15000 });
                const result = await response.json();
                if (result && result.status === 'success') {
                    state.data.settings.APP_LOGO = logoVal;
                    state.data.settings.APP_FOOTER_TEXT = footerVal;
                    state.data.settings.ENABLE_BUDGET = enableBudgetVal;
                    updateLogosInUI();
                    updateFooterInUI();
                    showToast("Semua Konfigurasi Berhasil Disimpan!", "success");
                    fetchDashboardData();
                }
            } catch (err) {
                state.data.settings.APP_LOGO = logoVal;
                state.data.settings.APP_FOOTER_TEXT = footerVal;
                state.data.settings.ENABLE_BUDGET = enableBudgetVal;
                updateLogosInUI();
                updateFooterInUI();
                showToast("Simpan gagal (Sandbox Offline Mode)", "warn");
            }
        }

                    sideBtn.className = v === view 
                        ? "w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-dana bg-blue-50/50 transition-all"
                        : "w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all";
                }
                if (navBtn) {
                    if (v === view) {
                        navBtn.classList.add('text-dana');
                        navBtn.classList.remove('text-gray-400');
                    } else {
                        navBtn.classList.remove('text-dana');
                        navBtn.classList.add('text-gray-400');
                    }
                }
            });
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'home') {
                container.innerHTML = DashboardView();
                setTimeout(() => setSubTab(state.subTab), 10);
            } else if (state.view === 'history') {
                container.innerHTML = HistoryView();
            } else if (state.view === 'analytics') {
                container.innerHTML = AnalyticsView();
                setTimeout(initPieChart, 50);
            } else if (state.view === 'walletReport') {
                container.innerHTML = WalletReportView();
            } else if (state.view === 'walletChat') {
                container.innerHTML = WalletChatView();
                setTimeout(() => {
                    const body = document.getElementById('wallet-chat-body');
                    if (body) body.scrollTop = body.scrollHeight;
                }, 50);
            } else if (state.view === 'users') {
                container.innerHTML = UsersView();
            } else if (state.view === 'profile') {
                container.innerHTML = ProfileView();
            }
            lucide.createIcons();
            updateFooterInUI();
        }

        // --- GRAFIK APEXCHARTS ---
        function initYearlyChart() {
            const el = document.querySelector("#chart-yearly");
            if (!el) return;
            el.innerHTML = "";

            const options = {
                series: [{
                    name: 'Pengeluaran',
                    data: [1500000, 2200000, 1800000, 2500000, 1900000, 3100000, 2400000]
                }],
                chart: { height: 260, type: 'bar', toolbar: { show: false }, fontFamily: 'Plus Jakarta Sans' },
                colors: ['#108EE9'],
                plotOptions: { bar: { borderRadius: 10, columnWidth: '45%' } },
                xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul'] },
                grid: { show: false }
            };
            new ApexCharts(el, options).render();
        }

        function initPieChart() {
            const el = document.querySelector("#pie-chart");
            if (!el) return;
            el.innerHTML = "";

            const expenses = state.data.transactions.filter(t => t.type === 'expense');
            const categories = [...new Set(expenses.map(t => t.category))];
            const dataset = categories.map(cat => expenses.filter(t => t.category === cat).reduce((a, b) => a + b.amount, 0));

            const options = {
                series: dataset.length > 0 ? dataset : [1],
                labels: categories.length > 0 ? categories : ['Belum Ada Pengeluaran'],
                chart: { type: 'donut', height: 280, fontFamily: 'Plus Jakarta Sans' },
                colors: ['#108EE9', '#FF8F3C', '#22C55E', '#A855F7', '#F43F5E'],
                legend: { position: 'bottom', horizontalAlign: 'center', fontWeight: 600 },
                plotOptions: {
                    pie: {
                        donut: {
                            size: '75%',
                            labels: {
                                show: true,
                                total: {
                                    show: true,
                                    label: 'Pengeluaran',
                                    formatter: () => formatIDR(state.data.stats.expense).replace('Rp', '')
                                }
                            }
                        }
                    }
                }
            };
            new ApexCharts(el, options).render();
        }

        // --- SISTEM MODAL PENCATATAN MANUAL ---
        function openModal(type, payload = {}) {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            if (type === 'addTransaction') {
                box.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-slate-900">Catat Manual Premium</h3>
                        <button onclick="closeModal()" class="w-10 h-10 bg-slate-50 hover:bg-slate-100 rounded-xl flex items-center justify-center text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="space-y-4">
                        <div class="flex p-1 bg-slate-100 rounded-2xl">
                            <button id="m-exp" onclick="setModalType('expense')" class="flex-1 py-3 rounded-xl font-bold text-xs bg-white text-dana shadow-sm">Pengeluaran</button>
                            <button id="m-inc" onclick="setModalType('income')" class="flex-1 py-3 rounded-xl font-bold text-xs text-slate-400">Pemasukan</button>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Kantong Dompet</label>
                            <select id="tx-wallet" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-semibold outline-none focus:border-dana font-sans">
                                ${walletOptionsHtml()}
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Nominal Uang (Rp)</label>
                            <input type="number" id="tx-amount" placeholder="0" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xl font-black outline-none focus:border-dana">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Kategori</label>
                            <select id="tx-category" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-semibold outline-none focus:border-dana">
                                <option>Makanan</option><option>Transportasi</option><option>Tagihan</option><option>Belanja</option><option>Gaji</option><option>Freelance</option><option>Pendidikan</option><option>Kesehatan</option><option>Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Catatan</label>
                            <input type="text" id="tx-note" placeholder="Contoh: Kopi pagi" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none focus:border-dana">
                        </div>
                        <button onclick="submitManualTransaction()" class="w-full py-4 bg-dana hover:bg-dana-dark text-white rounded-2xl font-bold text-sm shadow-md mt-4">Simpan Lokal</button>
                    </div>
                `;
            } else if (type === 'addBudget') {
                box.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-slate-900">Atur Anggaran Bulanan</h3>
                        <button onclick="closeModal()" class="w-10 h-10 bg-slate-50 hover:bg-slate-100 rounded-xl flex items-center justify-center text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Dompet</label>
                            <select id="bg-wallet" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-semibold outline-none focus:border-dana">${walletOptionsHtml()}</select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Kategori Pengeluaran</label>
                            <select id="bg-category" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-semibold outline-none focus:border-dana font-sans">
                                <option>Makanan</option><option>Transportasi</option><option>Tagihan</option><option>Belanja</option><option>Pendidikan</option><option>Kesehatan</option><option>Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Batas Bulanan (Rp)</label>
                            <input type="number" id="bg-limit" placeholder="1000000" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xl font-black outline-none focus:border-dana">
                        </div>
                        <label class="flex items-center gap-2 text-xs font-bold text-slate-600">
                            <input type="checkbox" id="bg-active" checked class="w-4 h-4 accent-blue-600"> Budget aktif
                        </label>
                        <button onclick="submitBudget()" class="w-full py-4 bg-dana hover:bg-dana-dark text-white rounded-2xl font-bold text-sm shadow-md mt-4">Tetapkan Anggaran</button>
                    </div>
                `;
            } else if (type === 'userForm') {
                const u = payload || {};
                box.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-slate-900">${u.userId ? 'Edit User' : 'Tambah User'}</h3>
                        <button onclick="closeModal()" class="w-10 h-10 bg-slate-50 hover:bg-slate-100 rounded-xl flex items-center justify-center text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="space-y-4">
                        <input type="hidden" id="user-id" value="${safeHtml(u.userId || '')}">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Nama</label>
                            <input type="text" id="user-name" value="${safeHtml(u.name || '')}" placeholder="Nama user" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:border-dana">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Nomor WhatsApp</label>
                            <input type="text" id="user-phone" value="${safeHtml(u.phone || '')}" placeholder="628xxxxxxxx" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-mono font-bold outline-none focus:border-dana">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Email Report</label>
                            <input type="email" id="user-email" value="${safeHtml(u.email || '')}" placeholder="email@domain.com" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-mono outline-none focus:border-dana">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Role</label>
                                <select id="user-role" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:border-dana">
                                    <option value="Admin" ${u.role === 'Admin' ? 'selected' : ''}>Admin</option>
                                    <option value="User" ${!u.role || u.role === 'User' ? 'selected' : ''}>User</option>
                                    <option value="Viewer" ${u.role === 'Viewer' ? 'selected' : ''}>Viewer</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Default Wallet</label>
                                <select id="user-default-wallet" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:border-dana">${walletOptionsHtml(u.defaultWallet)}</select>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 gap-2 p-4 bg-slate-50 rounded-2xl">
                            <label class="flex items-center gap-2 text-xs font-bold text-slate-600"><input type="checkbox" id="user-active" ${truthy(u.active, true) ? 'checked' : ''} class="w-4 h-4 accent-blue-600"> User aktif</label>
                            <label class="flex items-center gap-2 text-xs font-bold text-slate-600"><input type="checkbox" id="user-can-chat" ${truthy(u.canChatBot, false) ? 'checked' : ''} class="w-4 h-4 accent-blue-600"> Boleh chat ke bot</label>
                            <label class="flex items-center gap-2 text-xs font-bold text-slate-600"><input type="checkbox" id="user-can-report" ${truthy(u.canReceiveReport, false) ? 'checked' : ''} class="w-4 h-4 accent-blue-600"> Boleh terima report</label>
                        </div>
                        <button onclick="submitUserForm()" class="w-full py-4 bg-dana hover:bg-dana-dark text-white rounded-2xl font-bold text-sm shadow-md mt-4">Simpan User</button>
                    </div>
                `;
            }

            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            state.modalType = 'expense';
            lucide.createIcons();
        }


        function setModalType(type) {
            state.modalType = type;
            const mExp = document.getElementById('m-exp');
            const mInc = document.getElementById('m-inc');
            if (type === 'expense') {
                mExp.className = "flex-1 py-3 rounded-xl font-bold text-xs bg-white text-dana shadow-sm";
                mInc.className = "flex-1 py-3 rounded-xl font-bold text-xs text-slate-400";
            } else {
                mInc.className = "flex-1 py-3 rounded-xl font-bold text-xs bg-white text-green-500 shadow-sm";
                mExp.className = "flex-1 py-3 rounded-xl font-bold text-xs text-slate-400";
            }
        }

        function submitManualTransaction() {
            const amount = parseInt(document.getElementById('tx-amount').value);
            const category = document.getElementById('tx-category').value;
            const wallet = document.getElementById('tx-wallet').value;
            const note = document.getElementById('tx-note').value || category;
            
            if (isNaN(amount) || amount <= 0) return showToast("Nominal tidak valid", "warn");

            const item = {
                date: new Date().toISOString().slice(0, 10),
                type: state.modalType,
                category,
                amount,
                note,
                wallet: wallet
            };

            state.data.transactions.push(item);
            
            // Rekalkulasi data tempatan secara langsung untuk kelajuan prestasi antarmuka
            const inc = state.data.transactions.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
            const exp = state.data.transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
            state.data.stats = { balance: inc - exp, income: inc, expense: exp };

            closeModal();
            showToast("Transaksi Berhasil Direkam!", "success");
            render();
        }

        // --- PENGURUSAN BUDGET KATEGORI ---
        async function submitBudget() {
            const wallet = document.getElementById('bg-wallet')?.value || getDefaultWalletName();
            const cat = document.getElementById('bg-category')?.value || 'Lainnya';
            const limit = parseInt(document.getElementById('bg-limit')?.value || '0');
            const active = document.getElementById('bg-active')?.checked ? 'TRUE' : 'FALSE';

            if (isNaN(limit) || limit <= 0) return showToast("Batas anggaran tidak valid", "warn");

            const params = new URLSearchParams({
                action: 'saveBudget',
                wallet,
                category: cat,
                monthly_limit: limit,
                active
            });

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_URL}?${params.toString()}`, { timeout: 15000 });
                const result = await response.json();
                if (result && result.status === 'success') {
                    closeModal();
                    showToast(`Budget ${cat} berhasil disimpan!`, "success");
                    fetchDashboardData();
                } else throw new Error(result?.message || "Gagal");
            } catch (err) {
                state.data.budgets[cat] = limit;
                if (!Array.isArray(state.data.budgetList)) state.data.budgetList = [];
                state.data.budgetList.push({ wallet, category: cat, monthlyLimit: limit, active: active === 'TRUE' });
                closeModal();
                showToast(`Budget tersimpan lokal. Backend belum merespon.`, "warn");
                render();
            }
        }


        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, 200);
        }

        // --- PENYEDIAAN UTAMA SEWAKTU SKRIN DIMUAT ---
        window.onload = async () => {
            const desktopWaBtn = document.getElementById('desktop-wa-btn');
            if (desktopWaBtn) desktopWaBtn.href = `https://wa.me/${CONFIG.BOT_NUMBER}`;

            // Muat logo dari cache/localStorage secepat mungkin supaya lockscreen tidak tampil logo dummy.
            hydrateCachedBranding();

            // Refresh logo dari Google Sheets bahkan sebelum PIN dimasukkan.
            const brandingPromise = preloadBrandingBeforePin();

            // Periksa sekiranya PIN keselamatan telah disahkan sebelum ini
            if (sessionStorage.getItem('authenticated_pin') === 'true') {
                document.getElementById('pin-lockscreen').classList.add('hidden');
                await brandingPromise;
                fetchDashboardData();
            } else {
                document.getElementById('global-loader').classList.add('hidden');
                await brandingPromise;
                // Fokus pada input secara automatik setelah logo cloud selesai dicoba.
                setTimeout(focusPinInput, 300);
            }
        };
    </script>
</body>
